buildscript {
    ext.kotlin_version = "1.8.10" // Impost  Kotlin version
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.inventorymanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.inventorymanager"
        minSdk 21
        //noinspection OldTargetApi
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    configurations.configureEach {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10"
        }
    }
}

dependencies {
    implementation libs.kotlin.stdlib

    // Librerie Android
    implementation libs.androidx.appcompat.v161
    implementation libs.material.v190
    implementation libs.androidx.constraintlayout.v214
    implementation libs.androidx.activity.ktx

    // Room
    implementation libs.room.runtime
    annotationProcessor libs.androidx.room.compiler

    // Lifecycle
    implementation libs.androidx.lifecycle.viewmodel.v261
    implementation libs.androidx.lifecycle.livedata.v261

    // MPAndroidChart
    implementation libs.mpandroidchart.v310

    // Test
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit.v115
    androidTestImplementation libs.androidx.espresso.core.v351
}
